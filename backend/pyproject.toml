[project]
name = "resume-optimizer"
version = "0.1.0"
description = "LaTeX resume optimizer powered by Claude — tailors your resume to job descriptions while preserving your exact template."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "anthropic>=0.49",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.15",
    "pydantic-settings>=2.8",
    "python-multipart>=0.0.20",
    "google-auth>=2.38",
    "requests>=2.31",
    "PyJWT>=2.10",
    "slowapi>=0.1.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.25",
    "httpx>=0.28",
    "aiosqlite>=0.21",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# slowapi 0.1.9 still uses asyncio.iscoroutinefunction (deprecated in 3.14+); no newer PyPI release yet
filterwarnings = [
    "ignore:'asyncio.iscoroutinefunction' is deprecated:DeprecationWarning:slowapi.extension",
]
